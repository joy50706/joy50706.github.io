name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google Scholar profile
        run: python3 google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: oEvieAoAAAAJ
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- assets/data/google-scholar.json; then
            echo "Citation snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/google-scholar.json
          git commit -m "Update Google Scholar citation data"
          git push
